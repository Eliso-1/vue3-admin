<!--
  index.html —— 应用的"外壳" HTML 文件（也叫入口模板）

  它是浏览器真正打开的那个页面。
  Vite 启动后，会以这个文件为基础，把 Vue 应用"挂载"进来。

  注意：在这里你几乎看不到任何业务内容，
  因为真正的内容全部由 Vue 用 JavaScript 动态生成。
-->
<!DOCTYPE html>
<!-- lang 用于告诉浏览器/搜索引擎这个页面的语言，建议改成 "zh-CN"（简体中文） -->
<html lang="">
  <head>
    <!-- 声明字符编码为 UTF-8，避免中文出现乱码 -->
    <meta charset="UTF-8">
    <!-- 浏览器标签页上显示的小图标（放在 public 目录下） -->
    <link rel="icon" href="/favicon.ico">
    <!-- 移动端适配：让页面宽度等于设备宽度，初始缩放比例为 1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签页上显示的标题 -->
    <title>Vite App</title>
  </head>
  <body>
    <!--
      这个 id="app" 的 div 是"容器"。
      main.js 里的 app.mount('#app') 会把整个 Vue 应用渲染到这个元素里面。
      所以你打开页面看到的界面，实际都装在它内部。
    -->
    <div id="app"></div>
    <!--
      引入应用的入口 JS 文件（main.js）。
      type="module" 表示用 ES 模块的方式加载，Vite 会负责编译和热更新。
    -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
